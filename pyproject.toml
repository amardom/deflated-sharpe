[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deflated-sharpe"
version = "0.1.0"
description = "Deflated Sharpe Ratio, effective trial estimation, and transparent reporting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "threadpoolctl>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "--cov=deflated_sharpe --cov-branch --cov-report=term-missing --cov-fail-under=100"
